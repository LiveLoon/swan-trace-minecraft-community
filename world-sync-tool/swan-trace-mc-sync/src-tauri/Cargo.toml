
[package]
name = "swan-trace-mc-sync"
version = "0.1.0"
description = "Swan Trace Minecraft World Sync"
authors = ["LiveLoon"]
edition = "2021"

[lib]
name = "swan_trace_mc_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread"] }
tauri-plugin-store = "2.5.0"
