# BetterMOTDS Configuration

# Language file to use for plugin messages.
# Available languages are pt_PT (default) and en_US.
language: pt_PT

normal:
  # Default icon for normal mode (used if MOTD entry has no icon)
  # Path is relative to plugins/BetterMOTDS/
  default-icon: "icons/server-icon.png"

  motd:
    # Rotation mode: random, sequential, per-day
    rotation-mode: random

  # MOTD entries. Each entry always has two explicit lines.
  # If line2 is empty, a blank second line will still be sent.
  # Optional: set 'icon' per entry to override the default-icon.
