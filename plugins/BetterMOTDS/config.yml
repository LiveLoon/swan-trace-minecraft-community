  player-count:
    online:
      mode: real # real, static, random, offset
      value: 0 # Used for static and offset
      min: 10 # Used for random
      max: 50 # Used for random
    max:
      mode: real # real, static, random, offset
      value: 100
      min: 100
      max: 200

  hover:
    enabled: true
    lines:
      - "&b&lMy Awesome Server"
      - ""
      - "&7» &fWebsite: &a&nwww.example.com"
      - "&7» &fDiscord: &9&ndiscord.gg/example"

  # Legacy icon configuration (still supported as fallback)
  icon:
    files:
      - "server-icon.png"

maintenance:
  enabled: false
  reason: ""

  # Default icon for maintenance mode
  default-icon: "icons/maintenance-icon.png"

  motd:
    rotation-mode: random

  # MOTD entries for maintenance mode with optional per-MOTD icons
  motds:
    - line1: "&cMaintenance Mode"
      line2: "&7We'll be back soon! &f{reason}"
      # icon: "icons/maintenance-alt.png"  # Optional: per-MOTD icon

  player-count:
    online:
      mode: static
      value: -1
    max:
      mode: static
      value: -1

  hover:
    enabled: true
    lines:
      - "&c&lMaintenance Mode"
      - ""
      - "&7Reason: {reason}"
      - "&eCheck back later!"

  # Legacy icon configuration (still supported as fallback)
  icon:
    files:
      - "maintenance-icon.png"

  join-block:
    enabled: true
    kick-message-key: "maintenance.kick_message"
    default-reason: ""
