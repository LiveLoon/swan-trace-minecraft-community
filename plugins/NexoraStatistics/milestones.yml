# =====================================================================
# NexoraStatistics milestones.
#
# Each entry below fires a PlayerMilestoneEvent + runs reward commands
# when a stat crosses the threshold. Two flavours:
#
#   - fixed:     threshold: N                 (fires once when stat hits N)
#   - recurring: threshold: N, every: M       (fires every M after N)
#
# Placeholders inside rewards:
#   %player%      - the player's current name
#   %uuid%        - their UUID
#   %threshold%   - the threshold that was crossed
#   %stat%        - the stat key (e.g. blocks_broken)
# =====================================================================

