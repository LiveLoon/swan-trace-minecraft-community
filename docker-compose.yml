services:
  swan-trace-mc:
    build: .
    container_name: swan-trace-mc
    ports:
      - "5005:22"           # SSH（容器内 22）
      - "25265:25565"       # Java 版（对外 25265 → 容器 25565）
      - "27865:27865"
      - "24454:24454/udp"
      - "24454:24454/tcp"
      - "19132:19132/udp"   # 基岩版
      - "34832:34832"
      - "5006:3000"         # 面板/网站
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms2G -Xmx4G
      # 需要换下载源时改这里（覆盖 entrypoint 里的 DEFAULT_URL）
      - PAPER_URL=https://fill-data.papermc.io/v1/objects/b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083/paper-26.2-129.jar
    volumes:
      - .:/root
    restart: always

  swan-trace-mc-official-webside:
    build:
      context: .
      dockerfile: Dockerfile.springboot
    container_name: swan-trace-mc-official-webside
    volumes:
      - ./backups:/app/backups
      # 修正：实际文件名是 swan-trace-mc-server-1.0-SNAPSHOT.jar
      - ./swan-trace-mc-server-1.0-SNAPSHOT.jar:/app/swan-trace-mc-server-1.0-SNAPSHOT.jar
    ports:
      - "2344:8080"
    restart: always
